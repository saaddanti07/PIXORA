name: Android build

# PIXORA is developed without a local Android Studio installation: every
# verification and the APK itself are produced by this workflow.
on:
  push:
    branches:
      - main
      - 'arena/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Needed so a failing verification run can post its output back to the commit
# (the Actions log archive is not always reachable from every environment).
permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'
  JAVA_VERSION: '21'

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: |
          set +e
          flutter analyze 2>&1 | tee analysis.log
          echo "ANALYZE_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Publish failure details on the commit
        if: env.ANALYZE_EXIT != '0' || env.TEST_EXIT != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### flutter analyze — exit ${ANALYZE_EXIT}"
            echo '```'
            tail -c 18000 analysis.log
            echo '```'
            echo
            echo "### flutter test — exit ${TEST_EXIT}"
            echo '```'
            tail -c 40000 test.log
            echo '```'
          } > verification-report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@verification-report.md || echo "could not attach report"

      - name: Fail when analysis or tests failed
        if: env.ANALYZE_EXIT != '0' || env.TEST_EXIT != '0'
        run: exit 1

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --build-name "0.1.0" \
            --build-number "${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: pixora-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
